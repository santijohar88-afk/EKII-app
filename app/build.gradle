plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ekiii.teacherhub'
    compileSdk 35

    defaultConfig {
        applicationId "com.ekiii.teacherhub"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so `assembleRelease` gives an installable APK
            // without a keystore. Create your own keystore for Play Store / long-term updates.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.15.0'
}
